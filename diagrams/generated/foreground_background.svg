<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="414px" preserveAspectRatio="none" style="width:428px;height:414px;" version="1.1" viewBox="0 0 428 414" width="428px" zoomAndPan="magnify"><defs/><g><g class="entity" id="entity_h"><rect height="58.2656" rx="10" ry="10" style="stroke:var(--dg-hw-line,#1d4ed8);stroke-width:1;fill:var(--dg-hw-bg,#dbeafe)" width="415.2705" x="7" y="7"/><text font-family="'DM Sans',sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="146.4912" x="21" y="33.0669" style="fill:var(--dg-hw-ink,#1e3a8a)">HARDWARE EVENTS</text><text font-family="'DM Sans',sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.2705" x="21" y="48.1997" style="fill:var(--dg-hw-ink,#1e3a8a)">(Timer overflow &#183; UART Rx &#183; GPIO edge &#183; ADC complete &#183; ...)</text></g><g class="entity" id="entity_f"><rect height="88.5313" rx="10" ry="10" style="stroke:var(--dg-isr-line,#991b1b);stroke-width:1;fill:var(--dg-isr-bg,#fee2e2)" width="389.3213" x="19.97" y="133.26"/><text font-family="'DM Sans',sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="306.998" x="33.97" y="159.3269" style="fill:var(--dg-isr-ink,#7f1d1d)">FOREGROUND: Interrupt Service Routines</text><text font-family="'DM Sans',sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.4595" x="33.97" y="174.4597" style="fill:var(--dg-isr-ink,#7f1d1d)">&#8212; minimal work: read register, set flag, push to buffer</text><text font-family="'DM Sans',sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.3213" x="33.97" y="189.5925" style="fill:var(--dg-isr-ink,#7f1d1d)">&#8212; sets event flags visible to background loop</text><text font-family="'DM Sans',sans-serif" font-size="13" lengthAdjust="spacing" textLength="361.3213" x="33.97" y="204.7253" style="fill:var(--dg-isr-ink,#7f1d1d)">&#8212; returns control to wherever background was running</t
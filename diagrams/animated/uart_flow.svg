<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 215"><style>text{font-family:var(--sans),sans-serif;font-size:13px;fill:var(--text-2)}.b{font-weight:600;fill:var(--text)}.m{font-size:11px;fill:var(--text-3)}.l{fill:none;stroke:var(--text-2);stroke-width:2}.g{fill:none;stroke:var(--border-3);stroke-width:1}.d{stroke-dasharray:4 4}.box{fill:var(--surface-2);stroke:var(--border-3)}.head{stroke:var(--text);stroke-width:1.5;animation:uf-sweep 9s linear infinite}@keyframes uf-sweep{from{transform:translateX(0)}to{transform:translateX(594px)}}</style>
<text class="b" x="20" y="24">Sending 'A' (0x41), least significant bit first</text><rect class="box" x="20" y="44" width="54" height="34"/><text x="47.0" y="66" text-anchor="middle" class="m">Idle</text><rect class="box" x="74" y="44" width="54" height="34"/><text x="101.0" y="66" text-anchor="middle" class="m">Start</text><rect class="box" x="128" y="44" width="54" height="34"/><text x="155.0" y="66" text-anchor="middle" class="b">1</text><rect class="box" x="182" y="44" width="54" height="34"/><text x="209.0" y="66" text-anchor="middle" class="b">0</text><rect class="box" x="236" y="44" width="54" height="34"/><text x="263.0" y="66" text-anchor="middle" class="b">0</text><rect class="box" x="290" y="44" width="54" height="34"/><text x="317.0" y="66" text-anchor="middle" class="b">0</text><rect class="box" x="344" y="44" width="54" height="34"/><text x="371.0" y="66" text-anchor="middle" class="b">0</text><rect class="box" x="398" y="44" width="54" height="34"/><text x="425.0" y="66" text-anchor="middle" class="b">0</text><rect class="box" x="452" y="44" width="54" height="34"/><text x="479.0" y="66" text-anchor="middle" class="b">1</text><rect class="box" x="506" y="44" width="54" height="34"/><text x="533.0" y="66" text-anchor="middle" class="b">0</text><rect class="box" x="560" y="44" width="54" height="34"/><text x="587.0" y="66" text-anchor="middle" class="m">Stop</text>
<path class="l" d="M20 120H74V170H128V120H182V170H236V170H290V170H344V170H398V170H452V120H506V170H560V120H614"/><text class="m" x="20" y="198">The line idles high. The start bit pulls it low, so the receiver knows to begin timing.</text>

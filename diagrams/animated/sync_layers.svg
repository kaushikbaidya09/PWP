<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240"><style>text{font-family:var(--sans),sans-serif;font-size:13px;fill:var(--text-2)}.b{font-weight:600;fill:var(--text)}.m{font-size:11px;fill:var(--text-3)}.l{fill:none;stroke:var(--text-2);stroke-width:2}.g{fill:none;stroke:var(--border-3);stroke-width:1}.d{stroke-dasharray:4 4}.box{fill:var(--surface-2);stroke:var(--border-3)}.s0{animation:sl-0 12s linear infinite}@keyframes sl-0{0%,4%{opacity:0}7%,92%{opacity:1}100%{opacity:0}}.s1{animation:sl-1 12s linear infinite}@keyframes sl-1{0%,22%{opacity:0}25%,92%{opacity:1}100%{opacity:0}}.s2{animation:sl-2 12s linear infinite}@keyframes sl-2{0%,40%{opacity:0}43%,92%{opacity:1}100%{opacity:0}}.s3{animation:sl-3 12s linear infinite}@keyframes sl-3{0%,58%{opacity:0}61%,92%{opacity:1}100%{opacity:0}}.n5{opacity:0;animation:sl-a 12s linear infinite}.n6{animation:sl-b 12s linear infinite}@keyframes sl-a{0%,46%{opacity:1}49%,100%{opacity:0}}@keyframes sl-b{0%,46%{opacity:0}49%,92%{opacity:1}100%{opacity:0}}.w{animation:sl-w 12s linear infinite}@keyframes sl-w{0%,76%{opacity:0}80%,92%{opacity:1}100%{opacity:0}}</style>

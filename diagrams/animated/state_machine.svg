<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 225"><style>text{font-family:var(--sans),sans-serif;font-size:13px;fill:var(--text-2)}.b{font-weight:600;fill:var(--text)}.m{font-size:11px;fill:var(--text-3)}.l{fill:none;stroke:var(--text-2);stroke-width:2}.g{fill:none;stroke:var(--border-3);stroke-width:1}.d{stroke-dasharray:4 4}.box{fill:var(--surface-2);stroke:var(--border-3)}.t{fill:var(--text);transform:translate(90px,86px);animation:sm-go 12s linear infinite}@keyframes sm-go{0%,6%{transform:translate(90px,86px)}20%,26%{transform:translate(300px,86px)}36%,42%{transform:translate(530px,26px)}50%{transform:translate(300px,14px)}58%,62%{transform:translate(90px,86px)}72%,76%{transform:translate(300px,86px)}84%,88%{transform:translate(530px,146px)}94%{transform:translate(300px,206px)}100%{transform:translate(90px,86px)}}</style>

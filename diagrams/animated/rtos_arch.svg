<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 195"><style>text{font-family:var(--sans),sans-serif;font-size:13px;fill:var(--text-2)}.b{font-weight:600;fill:var(--text)}.m{font-size:11px;fill:var(--text-3)}.l{fill:none;stroke:var(--text-2);stroke-width:2}.g{fill:none;stroke:var(--border-3);stroke-width:1}.d{stroke-dasharray:4 4}.box{fill:var(--surface-2);stroke:var(--border-3)}.run{fill:var(--text-2)}.idle{fill:var(--surface-2);stroke:var(--border)}.head{stroke:var(--text);stroke-width:1.5;animation:ra-sweep 9s linear infinite}@keyframes ra-sweep{from{transform:translateX(0)}to{transform:translateX(520px)}}</style>
<text class="b" x="10" y="64">High priority</text><text class="b" x="10" y="124">Low priority</text>
<rect class="idle" x="110" y="44" width="520" height="30"/><rect class="idle" x="110" y="104" width="520" height="30"/>
<rect class="run" x="110" y="104" width="120" height="30"/><rect class="run" x="230" y="44" width="110" height="30"/><rect class="run" x="340" y="104" width="130" height="30"/><rect class="run" x="470" y="44" width="80" height="30"/><rect class="run" x="550" y="104" width="80" height="30"/>
<text class="m" x="196" y="28">event: high task wakes</text><text class="m" x="110" y="168">Filled bars show who has the CPU. The high-priority task takes over as soon as it is ready.</text>
<path class="head" d="M110 36V146"/></svg>
